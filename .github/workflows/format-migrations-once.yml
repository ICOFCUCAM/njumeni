name: One-time migration guard formatting repair

on:
  push:
    branches: ["claude/wonderful-franklin-lt09d7"]
    paths:
      - "scripts/ci/check-migrations.mjs"
      - "tests/migrations.test.mjs"
      - ".github/workflows/format-migrations-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format migration guard and tests
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@3.5.3
          npx --no-install prettier --write scripts/ci/check-migrations.mjs tests/migrations.test.mjs
      - name: Commit formatting
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/ci/check-migrations.mjs tests/migrations.test.mjs
            git commit -m "style(ci): format migration correction guard and tests"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
