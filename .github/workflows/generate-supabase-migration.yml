name: Generate Supabase migration from reviewed request

on:
  push:
    branches: ["claude/wonderful-franklin-lt09d7"]
    paths:
      - ".migration-requests/principal-and-user-profiles.sql"
      - ".github/workflows/generate-supabase-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify CLI commands and generate migration filename
        shell: bash
        run: |
          supabase --version
          supabase migration new --help
          supabase migration new principal_and_user_profiles
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_principal_and_user_profiles.sql' -print -quit)"
          test -n "$migration_file"
          test -f .migration-requests/principal-and-user-profiles.sql
          cp .migration-requests/principal-and-user-profiles.sql "$migration_file"
          test -s "$migration_file"
          rm .migration-requests/principal-and-user-profiles.sql
          echo "Generated migration: $migration_file"

      - name: Commit CLI-generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations .migration-requests/principal-and-user-profiles.sql
          git commit -m "db: add principal and user profile migration"
          git push
