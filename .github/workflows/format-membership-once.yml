name: One-time membership formatting repair

on:
  push:
    branches: ["claude/wonderful-franklin-lt09d7"]
    paths:
      - "apps/web/tests/membership-invitation-contract.test.mjs"
      - "apps/web/src/app/(workspace)/settings/workspaces/page.tsx"
      - "apps/web/src/app/globals.css"
      - ".github/workflows/format-membership-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format membership sources and CSS
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@3.5.3
          npx --no-install prettier --write "apps/web/tests/membership-invitation-contract.test.mjs" "apps/web/src/app/(workspace)/settings/workspaces/page.tsx" apps/web/src/app/globals.css
      - name: Commit formatting
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "apps/web/tests/membership-invitation-contract.test.mjs" "apps/web/src/app/(workspace)/settings/workspaces/page.tsx" apps/web/src/app/globals.css
            git commit -m "style(identity): format membership page and styles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
