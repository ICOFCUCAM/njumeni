name: One-time Supabase type formatting repair

on:
  push:
    branches: ["claude/wonderful-franklin-lt09d7"]
    paths:
      - "apps/web/src/lib/supabase/database.types.ts"
      - "apps/web/src/lib/supabase/server.ts"
      - ".github/workflows/format-supabase-types-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format generated database contract
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@3.5.3
          npx --no-install prettier --write apps/web/src/lib/supabase/database.types.ts apps/web/src/lib/supabase/server.ts
      - name: Commit formatting
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/lib/supabase/database.types.ts apps/web/src/lib/supabase/server.ts
            git commit -m "style(db): format generated types and server client"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
