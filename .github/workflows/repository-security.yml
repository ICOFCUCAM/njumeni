name: Njumeni CI and security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, type, tests, build and migration policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned CI tools
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@3.5.3 eslint@10.0.0 typescript@5.8.3

      - name: Check formatting
        run: npx --no-install prettier --check .prettierrc.json tsconfig.ci.json eslint.config.mjs scripts/ci/verify-foundation.mjs scripts/ci/check-migrations.mjs scripts/ci/typecheck-probe.ts tests/foundation.test.mjs tests/migrations.test.mjs tests/app-shell.test.mjs tests/original-plan.test.mjs tests/infrastructure-audit.test.mjs apps/web/tests/auth-session.test.mjs apps/web/tests/auth-boundary-contract.test.mjs apps/web/tests/profile-boundary-contract.test.mjs apps/web/tests/profile-validation.test.mjs apps/web/tests/organisation-workspace-contract.test.mjs apps/web/tests/membership-invitation-contract.test.mjs apps/web/scripts/auth-provider.integration.test.mjs "apps/web/src/app/(workspace)/settings/profile/actions.ts" "apps/web/src/app/(workspace)/settings/workspaces/actions.ts" apps/web/src/lib/profile-validation.ts apps/web/package.json apps/web/package-lock.json apps/web/tsconfig.json apps/web/next.config.ts apps/web/postcss.config.mjs apps/web/src/app/globals.css apps/web/src/modules/registry.ts "apps/web/src/**/*.tsx"

      - name: Lint CI scripts and tests
        run: npx --no-install eslint eslint.config.mjs scripts/ci/verify-foundation.mjs scripts/ci/check-migrations.mjs tests/foundation.test.mjs tests/migrations.test.mjs tests/app-shell.test.mjs tests/original-plan.test.mjs tests/infrastructure-audit.test.mjs apps/web/tests/auth-session.test.mjs apps/web/tests/profile-boundary-contract.test.mjs apps/web/tests/profile-validation.test.mjs apps/web/tests/organisation-workspace-contract.test.mjs apps/web/tests/membership-invitation-contract.test.mjs apps/web/scripts/auth-provider.integration.test.mjs

      - name: Type-check strict TypeScript baseline
        run: npx --no-install tsc --project tsconfig.ci.json

      - name: Run foundation and migration tests
        run: node --test tests/*.test.mjs

      - name: Enforce migration naming, order and immutability
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/check-migrations.mjs

      - name: Run foundation build/architecture integrity check
        run: node scripts/ci/verify-foundation.mjs

      - name: Build application shell when present
        if: hashFiles('apps/web/package.json') != ''
        working-directory: apps/web
        env:
          # Non-routable placeholders ensure the protected route is classified as
          # request-dynamic during CI build without using live provider credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://njumeni-ci.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          npm ci --no-audit --no-fund
          npm run test:auth
          npm run typecheck
          npm run build

      - name: Require dedicated test credentials for manual live verification
        if: github.event_name == 'workflow_dispatch' && hashFiles('apps/web/package.json') != ''
        env:
          NJUMENI_TEST_SUPABASE_URL: ${{ secrets.NJUMENI_TEST_SUPABASE_URL }}
          NJUMENI_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NJUMENI_TEST_SUPABASE_PUBLISHABLE_KEY }}
          NJUMENI_TEST_EMAIL: ${{ secrets.NJUMENI_TEST_EMAIL }}
          NJUMENI_TEST_PASSWORD: ${{ secrets.NJUMENI_TEST_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in NJUMENI_TEST_SUPABASE_URL NJUMENI_TEST_SUPABASE_PUBLISHABLE_KEY NJUMENI_TEST_EMAIL NJUMENI_TEST_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Manual live Auth verification requires these repository Actions secrets: %s\\n' "${missing[*]}"
            exit 1
          fi

      - name: Run optional live Supabase Auth integration test
        if: hashFiles('apps/web/package.json') != ''
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NJUMENI_TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NJUMENI_TEST_SUPABASE_PUBLISHABLE_KEY }}
          NJUMENI_TEST_EMAIL: ${{ secrets.NJUMENI_TEST_EMAIL }}
          NJUMENI_TEST_PASSWORD: ${{ secrets.NJUMENI_TEST_PASSWORD }}
        run: npm run test:auth-integration

  content-policy:
    name: Block customer documents and private-data paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked repository content
        run: bash scripts/security/check-repository-content.sh

  secret-scan:
    name: Scan for accidentally committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
