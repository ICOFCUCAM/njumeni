name: Repository security guard

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  content-policy:
    name: Block customer documents and private-data paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked repository content
        run: bash scripts/security/check-repository-content.sh

  secret-scan:
    name: Scan for accidentally committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
