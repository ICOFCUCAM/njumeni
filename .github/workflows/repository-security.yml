name: Njumeni CI and security

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, type, tests, build and migration policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned CI tools
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@3.5.3 eslint@10.0.0 typescript@5.8.3

      - name: Generate app dependency lockfile
        if: hashFiles('apps/web/package.json') != ''
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "APP_LOCKFILE_B64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "APP_LOCKFILE_B64_END"

      - name: Apply canonical Prettier formatting to app source
        if: hashFiles('apps/web/package.json') != ''
        run: |
          npx --no-install prettier --write apps/web/package.json apps/web/tsconfig.json apps/web/next.config.ts apps/web/postcss.config.mjs apps/web/src/app/globals.css "apps/web/src/**/*.tsx"
          for file in apps/web/package.json apps/web/tsconfig.json apps/web/next.config.ts apps/web/postcss.config.mjs apps/web/src/app/globals.css apps/web/src/app/layout.tsx apps/web/src/app/page.tsx apps/web/src/app/not-found.tsx apps/web/src/app/error.tsx apps/web/src/app/api/health/route.ts "apps/web/src/app/(workspace)/layout.tsx" "apps/web/src/app/(workspace)/dashboard/page.tsx" "apps/web/src/app/(workspace)/[slug]/page.tsx" "apps/web/src/app/(auth)/sign-in/page.tsx" apps/web/src/components/module-icon.tsx apps/web/src/components/workspace-shell.tsx apps/web/src/components/module-landing.tsx apps/web/src/modules/registry.ts; do
            echo "APP_SOURCE_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "APP_SOURCE_FILE_END:$file"
          done

      - name: Check formatting
        run: npx --no-install prettier --check .prettierrc.json tsconfig.ci.json eslint.config.mjs scripts/ci/verify-foundation.mjs scripts/ci/check-migrations.mjs scripts/ci/typecheck-probe.ts tests/foundation.test.mjs tests/migrations.test.mjs apps/web/package.json apps/web/tsconfig.json apps/web/next.config.ts apps/web/postcss.config.mjs apps/web/src/app/globals.css "apps/web/src/**/*.tsx"

      - name: Lint CI scripts and tests
        run: npx --no-install eslint eslint.config.mjs scripts/ci/verify-foundation.mjs scripts/ci/check-migrations.mjs tests/foundation.test.mjs tests/migrations.test.mjs

      - name: Type-check strict TypeScript baseline
        run: npx --no-install tsc --project tsconfig.ci.json

      - name: Run foundation and migration tests
        run: node --test tests/*.test.mjs

      - name: Enforce migration naming, order and immutability
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/check-migrations.mjs

      - name: Run foundation build/architecture integrity check
        run: node scripts/ci/verify-foundation.mjs

      - name: Build application shell when present
        shell: bash
        run: |
          if [[ -f apps/web/package.json ]]; then
            cd apps/web
            npm ci --no-audit --no-fund
            npm run typecheck
            npm run build
          else
            echo "::notice::No application shell exists yet; application build is deferred to task 0.12."
          fi

  content-policy:
    name: Block customer documents and private-data paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked repository content
        run: bash scripts/security/check-repository-content.sh

  secret-scan:
    name: Scan for accidentally committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
