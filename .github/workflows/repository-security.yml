name: Njumeni CI and security

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, type, tests, build and migration policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned CI tools
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@3.5.3 eslint@10.0.0 typescript@5.8.3

      - name: Generate canonical Prettier formatting for migration guard files
        run: |
          npx --no-install prettier --write scripts/ci/check-migrations.mjs tests/migrations.test.mjs
          echo "MIGRATION_GUARD_FORMATTED_B64_BEGIN"
          base64 -w0 scripts/ci/check-migrations.mjs
          echo
          echo "MIGRATION_GUARD_FORMATTED_B64_END"
          echo "MIGRATION_TEST_FORMATTED_B64_BEGIN"
          base64 -w0 tests/migrations.test.mjs
          echo
          echo "MIGRATION_TEST_FORMATTED_B64_END"

      - name: Check formatting
        run: npx --no-install prettier --check .prettierrc.json tsconfig.ci.json eslint.config.mjs scripts/ci/verify-foundation.mjs scripts/ci/check-migrations.mjs scripts/ci/typecheck-probe.ts tests/foundation.test.mjs tests/migrations.test.mjs

      - name: Lint CI scripts and tests
        run: npx --no-install eslint eslint.config.mjs scripts/ci/verify-foundation.mjs scripts/ci/check-migrations.mjs tests/foundation.test.mjs tests/migrations.test.mjs

      - name: Type-check strict TypeScript baseline
        run: npx --no-install tsc --project tsconfig.ci.json

      - name: Run foundation and migration tests
        run: node --test tests/*.test.mjs

      - name: Enforce migration naming, order and immutability
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/check-migrations.mjs

      - name: Run foundation build/architecture integrity check
        run: node scripts/ci/verify-foundation.mjs

      - name: Run application build when the application shell exists
        shell: bash
        run: |
          if [[ -f apps/web/package.json ]]; then
            node -e "const p=require('./apps/web/package.json'); if (!p.scripts?.build) process.exit(1)"
            cd apps/web
            npm run build
          else
            echo "::notice::No application shell exists yet. The foundation build passed; the application build gate activates in Phase 0 task 0.12."
          fi

  content-policy:
    name: Block customer documents and private-data paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked repository content
        run: bash scripts/security/check-repository-content.sh

  secret-scan:
    name: Scan for accidentally committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
