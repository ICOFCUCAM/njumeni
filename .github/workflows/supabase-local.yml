name: Njumeni local database verification

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-database:
    name: Supabase CLI generation and clean local replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Initialise local-only Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase --version
      - name: Verify migration names are generated by the CLI
        shell: bash
        run: |
          supabase migration new cli_name_provenance_probe
          probe="$(find supabase/migrations -maxdepth 1 -type f -name '*_cli_name_provenance_probe.sql' -print -quit)"
          test -n "$probe"
          basename "$probe" | tee "$RUNNER_TEMP/cli-generated-migration-name.txt"
          rm "$probe"
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Replay every migration from an empty local database
        run: supabase db reset
      - name: Run PostgreSQL RLS and profile lifecycle tests
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
