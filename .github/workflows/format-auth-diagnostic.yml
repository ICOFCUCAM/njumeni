name: Temporary auth formatter diagnostic

on:
  push:
    branches: ["claude/wonderful-franklin-lt09d7"]

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@3.5.3
      - name: Show exact formatter diff
        run: |
          npx --no-install prettier --write "apps/web/src/app/(auth)/sign-in/page.tsx"
          git diff -- "apps/web/src/app/(auth)/sign-in/page.tsx"
