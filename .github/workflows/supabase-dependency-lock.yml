name: Resolve pinned Supabase SDK lockfile

on:
  push:
    branches:
      - claude/wonderful-franklin-lt09d7
    paths:
      - apps/web/package.json
      - .github/workflows/supabase-dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: supabase-dependency-lock
  cancel-in-progress: false

jobs:
  resolve-and-verify:
    name: Resolve npm lockfile and verify web application
    runs-on: ubuntu-latest
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          ref: claude/wonderful-franklin-lt09d7
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Resolve exact dependency graph into the committed lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean reproducible installation
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Format changed application and test sources
        run: npx --yes prettier@3.5.3 --write tests/app-shell.test.mjs apps/web/src/app/globals.css "apps/web/src/**/*.tsx"

      - name: Type-check application
        working-directory: apps/web
        run: npm run typecheck

      - name: Build application
        working-directory: apps/web
        run: npm run build

      - name: Commit generated lockfile
        id: lock
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/package-lock.json tests/app-shell.test.mjs apps/web/src/app/globals.css 'apps/web/src/**/*.tsx'
            git commit -m "style: format Supabase Auth integration and lockfile"
            git push origin HEAD:claude/wonderful-franklin-lt09d7
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch full repository security workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run repository-security.yml --ref claude/wonderful-franklin-lt09d7
