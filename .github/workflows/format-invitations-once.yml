name: One-time invitation source formatting repair

on:
  push:
    branches: ["claude/wonderful-franklin-lt09d7"]
    paths:
      - "apps/web/src/app/(workspace)/settings/workspaces/actions.ts"
      - "apps/web/src/app/(workspace)/settings/workspaces/InvitationForm.tsx"
      - "apps/web/src/app/(auth)/invitations/accept/AcceptInvitationForm.tsx"
      - ".github/workflows/format-invitations-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format invitation sources
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund prettier@3.5.3
          npx --no-install prettier --write "apps/web/src/app/(workspace)/settings/workspaces/actions.ts" "apps/web/src/app/(workspace)/settings/workspaces/InvitationForm.tsx" "apps/web/src/app/(auth)/invitations/accept/AcceptInvitationForm.tsx"
      - name: Commit formatting
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "apps/web/src/app/(workspace)/settings/workspaces/actions.ts" "apps/web/src/app/(workspace)/settings/workspaces/InvitationForm.tsx" "apps/web/src/app/(auth)/invitations/accept/AcceptInvitationForm.tsx"
            git commit -m "style(identity): format invitation server and client actions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
