name: One-time format profile implementation

on:
  push:
    branches: ["claude/wonderful-franklin-lt09d7"]
    paths:
      - ".migration-requests/format-profile.trigger"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format profile files
        run: |
          npx --yes prettier@3.5.3 --write "apps/web/src/app/(workspace)/settings/profile/actions.ts" "apps/web/src/app/(workspace)/settings/profile/page.tsx" apps/web/tests/profile-boundary-contract.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/src/app/(workspace)/settings/profile/actions.ts" "apps/web/src/app/(workspace)/settings/profile/page.tsx" apps/web/tests/profile-boundary-contract.test.mjs
          git diff --cached --quiet || (git commit -m "style(account): format profile settings implementation" && git push)
